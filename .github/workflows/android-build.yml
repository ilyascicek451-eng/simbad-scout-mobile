name: Android build
# Builds installable Android artifacts with Expo prebuild + Gradle.
# Release outputs are signed with the Expo template's DEBUG keystore: fine for internal
# device testing, NOT for Google Play (an upload key is required; see docs/ANDROID_RELEASE.md).
# Builds the installable APK after a merge to main (and on demand). Not on pull requests: mobile.yml already
# typechecks and tests every mobile PR, and a 17-minute build per PR would exhaust the free Actions minutes.
# Public build repository: only manual runs and pushes to main (no pull_request trigger, so code from forks
# never runs with the signing secrets). Secrets stay in this repository's GitHub Secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      # Empty = the app asks for the server address on first start (e.g. the live test environment URL).
      EXPO_PUBLIC_API_URL: ${{ vars.SIMBAD_API_URL || 'https://api.130-61-212-91.sslip.io' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed public inputs before dependencies or signing
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py' -v
          python3 ci/verify-build-inputs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and mobile unit tests before signing
        run: |
          npm run typecheck
          npm test
      - name: Record public build identity (no private repository identifiers)
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = Path('ci/build-inputs.json').read_bytes()
          data = {'schema_version': 1, 'public_commit': os.environ['GITHUB_SHA'],
                  'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'public_inputs_sha256': hashlib.sha256(manifest).hexdigest(),
                  'checks': ['public_inputs', 'typecheck', 'mobile_unit_tests']}
          Path(os.environ['RUNNER_TEMP'], 'build-provenance.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Version code from the run number (every build is a valid Play update)
        run: |
          python3 - <<'PY'
          import json, os
          p = "app.json"; a = json.load(open(p))
          code = 300 + int(os.environ["GITHUB_RUN_NUMBER"])  # above every version code uploaded from the main repository
          a["expo"]["android"]["versionCode"] = code
          json.dump(a, open(p, "w"), indent=2, ensure_ascii=False)
          print(f"versionName {a['expo']['version']}  versionCode {code}")
          PY
      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: Check generated namespace matches Kotlin package declarations
        run: |
          ns=$(sed -nE "s/^\s*namespace '([^']+)'.*/\1/p" android/app/build.gradle)
          echo "namespace: $ns"
          for f in $(find android/app/src/main -name "*.kt"); do
            pkg=$(sed -nE 's/^package ([a-zA-Z0-9_.]+).*/\1/p' "$f")
            echo "$f -> $pkg"
            test "$pkg" = "$ns" || { echo "::error::package $pkg in $f does not match namespace $ns"; exit 1; }
          done
      - name: Restore Play upload key (only when the repository secrets exist)
        id: upload_key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          SIMBAD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Phones often add spaces / line breaks / invisible characters when copying a long text: remove them.
            clean=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | tr -d '\r\302\240\342\200\213')
            bad=$(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=' | wc -c)
            len=${#clean}
            echo "upload key secret: $len characters, $((len % 4)) left over, $bad unexpected characters (content is never printed)"
            if [ "$bad" -ne 0 ] || [ $((len % 4)) -ne 0 ] || [ "$len" -lt 3000 ]; then
              echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 yanlış ya da eksik kopyalanmış ($len karakter; yaklaşık 5900 olmalı). 1-ANDROID_UPLOAD_KEYSTORE_BASE64.txt dosyasının TAMAMINI yeniden kopyalayıp sırrı güncelleyin (kalem simgesi)."
              exit 1
            fi
            printf '%s' "$clean" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
            pass=$(printf '%s' "$SIMBAD_UPLOAD_STORE_PASSWORD" | tr -d '[:space:]' | tr -d '\r\302\240\342\200\213')
            echo "::add-mask::$pass"
            echo "password secret: ${#pass} characters (the generator makes 32)"
            if ! keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$pass" >/dev/null 2>&1; then
              echo "::error::Anahtar dosyası açılamadı: ANDROID_UPLOAD_KEYSTORE_PASSWORD bu anahtara ait değil ya da yanlış kopyalanmış (${#pass} karakter geldi, 32 olmalı). 2-ANDROID_UPLOAD_KEYSTORE_PASSWORD.txt içeriğini yeniden yapıştırın."
              exit 1
            fi
            { echo "SIMBAD_UPLOAD_STORE_PASSWORD=$pass"; echo "SIMBAD_UPLOAD_KEY_PASSWORD=$pass"; } >> "$GITHUB_ENV"
            echo "SIMBAD_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
            echo "signed=upload" >> "$GITHUB_OUTPUT"
          else
            echo "No upload key secret: release outputs will be DEBUG-signed (internal testing only)."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle build (debug APK, release APK, release AAB)
        working-directory: android
        env:
          # Store/key passwords come from the previous step (whitespace-cleaned, masked, via GITHUB_ENV).
          SIMBAD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS || 'simbad-upload' }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Show which certificate signed the release AAB
        working-directory: android/app/build/outputs/bundle/release
        run: |
          echo "signing mode: ${{ steps.upload_key.outputs.signed }}"
          keytool -printcert -jarfile app-release.aab | grep -E "Owner:|SHA256:" | head -2
      - name: Remove restored keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - name: Inspect artifacts
        working-directory: android/app/build/outputs
        run: |
          ls -la apk/debug apk/release bundle/release
          test -s apk/debug/app-debug.apk && test -s apk/release/app-release.apk && test -s bundle/release/app-release.aab
          # The release APK must carry the JavaScript bundle (standalone, no Metro server needed)
          unzip -l apk/release/app-release.apk | grep -q "assets/index.android.bundle"
          # The phone-installable APK must carry a valid v2 signature (installers refuse unsigned / v1-only APKs)
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose --print-certs apk/release/app-release.apk | grep -E "Verified using v2|Verified using v3|Signer #1 certificate DN"
          "$bt/apksigner" verify apk/release/app-release.apk
          "$bt/zipalign" -c -p 4 apk/release/app-release.apk && echo "zipalign ok"
          unzip -l apk/release/app-release.apk | grep -E "lib/(arm64-v8a|armeabi-v7a)/" | head -3
          # minSdk / targetSdk as built
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt dump badging apk/release/app-release.apk | grep -E "^package:|sdkVersion|targetSdkVersion"
          cp "$RUNNER_TEMP/build-provenance.json" build-provenance.json
      - name: Phone-installable APK as its own small download
        uses: actions/upload-artifact@v4
        with:
          name: SIMBAD-SCOUT-telefona-kur-${{ github.run_number }}
          retention-days: 30
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Google Play upload (internal testing) — only with the upload key and a Play service account
        if: steps.upload_key.outputs.signed == 'upload' && github.ref == 'refs/heads/main' && env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.simbadscout
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          # "draft" until the app's first release is out in the Play Console; then set the variable to "completed"
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          whatsNewDirectory: whatsnew
      - uses: actions/upload-artifact@v4
        with:
          name: simbad-scout-android-${{ github.sha }}
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/build-provenance.json


name: Public mobile checks
on:
  push:
    branches: [codex/public-mobile-checks]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-mobile-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install locked public dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck public mobile code
        run: npm run typecheck
      - name: Test public mobile code
        run: npm test
      - name: Build Android JavaScript bundle without signing or publishing
        run: npm run bundle:android
      - name: Remove generated bundle
        if: always()
        run: rm -rf dist
